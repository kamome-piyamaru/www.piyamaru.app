<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Download sample</title>
  <style>
    /* ── 既存サイトの dl-btn スタイル（参考） ── */
    .dl-btns { display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:40px }
    .dl-btn {
      display:flex; flex-direction:column; align-items:flex-start; gap:2px;
      background:#1e2a1a; border:1px solid #4A5140; border-radius:8px;
      padding:18px 28px; min-width:250px; text-align:left; cursor:pointer;
      color:#e8f5e9; text-decoration:none;
      transition:border-color .15s ease, transform .15s ease;
    }
    .dl-btn:hover { border-color:#7ec850; transform:translateY(-2px) }
    .dl-os  { font-size:16px; font-weight:700 }
    .dl-meta { font-size:12px; color:#8a9e80; font-family:monospace }

    /* ▼ スクリプトが付与する推奨クラス（サイト側の CSS に追加してください） */
    .dl-btn--recommended {
      border-color: #7ec850;
      box-shadow: 0 0 0 1px #7ec850;
    }
  </style>
</head>
<body>

  <!-- ============================================================
       既存ページへの組み込み手順
       ① 既存の <a class="dl-btn"> に data-fm-key 属性を追加する
       ② </body> 直前に <script src="download-widget.js"> を追加する
       ③ CSS に .dl-btn--recommended スタイルを追加する（任意）
       ============================================================ -->

  <div class="dl-btns">

    <!-- ▼ data-fm-key="mac" を追加するだけ（既存デザインはそのまま） -->
    <a class="dl-btn" data-fm-key="mac" href="#">
      <span class="dl-os">macOS</span>
      <span class="dl-meta">.dmg — Apple Silicon / Intel</span>
    </a>

    <!-- ▼ data-fm-key="win-x64" を追加するだけ -->
    <a class="dl-btn" data-fm-key="win-x64" href="#">
      <span class="dl-os">Windows</span>
      <span class="dl-meta">.exe — Windows 10 / 11</span>
    </a>

  </div>

  <!-- ▼ スクリプト読み込み（download-widget.js を同じディレクトリに配置） -->
  <script src="download-widget.js"></script>

</body>
</html>
