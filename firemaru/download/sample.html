<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Download sample</title>
  <style>
    .dl-btns { display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:40px }
    .dl-btn {
      display:flex; flex-direction:column; align-items:flex-start; gap:2px;
      background:#1e2a1a; border:1px solid #4A5140; border-radius:8px;
      padding:18px 28px; min-width:220px; text-align:left; cursor:pointer;
      color:#e8f5e9; text-decoration:none;
      transition:border-color .15s ease, transform .15s ease;
    }
    .dl-btn:hover { border-color:#7ec850; transform:translateY(-2px) }
    .dl-os   { font-size:16px; font-weight:700 }
    .dl-meta { font-size:12px; color:#8a9e80; font-family:monospace }
  </style>
</head>
<body>

  <div class="dl-btns">
    <a class="dl-btn" data-fm-key="mac-arm64" href="#">
      <span class="dl-os">macOS (Apple Silicon)</span>
      <span class="dl-meta">.dmg — M1 / M2 / M3 / M4</span>
    </a>
    <a class="dl-btn" data-fm-key="mac-x64" href="#">
      <span class="dl-os">macOS (Intel)</span>
      <span class="dl-meta">.dmg — Intel Core</span>
    </a>
    <a class="dl-btn" data-fm-key="win-x64" href="#">
      <span class="dl-os">Windows</span>
      <span class="dl-meta">.exe — Windows 10 / 11</span>
    </a>
  </div>

  <script src="download-widget.js"></script>

</body>
</html>
