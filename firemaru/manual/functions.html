<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firemaru</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body data-title-key="page_title">
  <header class="site-header">
    <div class="header-left">
      <button type="button" class="menu-button" aria-label="Toggle navigation" onclick="toggleSidebar()">☰</button>
      <a class="brand" href="./index.html">
        <img class="brand-logo" src="./assets/logo.png" alt="Firemaru logo" />
        <div class="brand-copy">
          <strong>Firemaru</strong>
          <span data-key="manual_label"></span>
        </div>
      </a>
    </div>
    <div class="header-right">
      <div class="lang-switcher">
        <button type="button" onclick="setLang('ja')" id="btn-ja">JA</button>
        <button type="button" onclick="setLang('en')" id="btn-en">EN</button>
        <button type="button" onclick="setLang('de')" id="btn-de">DE</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <p class="sidebar-label" data-key="sidebar_title"></p>
        <nav>
          <a class="" href="./index.html"><span data-key="nav_home"></span></a>
          <a class="" href="./getting-started.html"><span data-key="nav_getting_started"></span></a>
          <a class="" href="./firestore.html"><span data-key="nav_firestore"></span></a>
          <a class="" href="./storage.html"><span data-key="nav_storage"></span></a>
          <a class="" href="./backup.html"><span data-key="nav_backup"></span></a>
          <a class="active" href="./functions.html"><span data-key="nav_functions"></span></a>
          <a class="" href="./license.html"><span data-key="nav_license"></span></a>
          <a class="" href="./settings.html"><span data-key="nav_settings"></span></a>
        </nav>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="closeSidebar()"></div>
    <main class="page-content">
      <section class="hero-card"><div class="eyebrow" data-key="hero_badge"></div><h1 data-key="page_title"></h1><p class="lead" data-key="page_desc"></p></section>
<div class="section-stack"><section class="content-section"><div class="mini-card-grid"><div class="mini-card"><h2 data-key="section_functions"></h2><p data-key="functions_desc"></p></div><div class="mini-card"><h2 data-key="section_auth"></h2><p data-key="auth_desc"></p></div></div><figure class="screenshot" data-fig="fig5-1.png"><img src="./img/ja/fig5-1.png" alt="" onload="this.classList.add('loaded')" onerror="this.closest('figure').classList.add('has-error')"><div class="fig-placeholder"><span class="fig-name">fig5-1.png</span><span class="fig-desc" data-key="shot_functions"></span></div><figcaption><span class="fig-name">fig5-1.png</span> — <span data-key="shot_functions"></span></figcaption></figure></section></div>
      
    </main>
  </div>
  <script>
    const TEXTS = {
  "ja": {
    "nav_home": "ホーム",
    "nav_getting_started": "はじめに",
    "nav_firestore": "Firestore",
    "nav_storage": "Storage",
    "nav_backup": "バックアップ",
    "nav_functions": "Functions & Auth",
    "nav_license": "ライセンス",
    "nav_settings": "設定",
    "manual_label": "Webマニュアル",
    "sidebar_title": "ページ一覧",
    "hero_badge": "Desktop Manual",
    "page_title": "Cloud Functions & Auth",
    "page_desc": "Cloud Functions のログ監視と Firebase Auth 管理機能を説明します。",
    "section_functions": "Cloud Functions ログ",
    "functions_desc": "サイドバーから「Functions」を選択します。デプロイ済みの Cloud Functions の一覧が表示されます。関数を選択すると、リアルタイムでログが表示されます。",
    "section_auth": "Firebase Auth 管理",
    "auth_desc": "サイドバーから「Auth」を選択します。Firebase Authentication に登録されているユーザーの一覧が表示されます。ユーザーの作成・削除・詳細確認が可能です。",
    "shot_functions": "Screenshot: Functions ログストリームと Auth ユーザー一覧"
  },
  "en": {
    "nav_home": "Home",
    "nav_getting_started": "Getting Started",
    "nav_firestore": "Firestore",
    "nav_storage": "Storage",
    "nav_backup": "Backup",
    "nav_functions": "Functions & Auth",
    "nav_license": "License",
    "nav_settings": "Settings",
    "manual_label": "Web Manual",
    "sidebar_title": "Pages",
    "hero_badge": "Desktop Manual",
    "page_title": "Cloud Functions & Auth",
    "page_desc": "Manage Cloud Functions logs and Firebase Auth users from one place.",
    "section_functions": "Cloud Functions Logs",
    "functions_desc": "Select \"Functions\" from the sidebar. A list of deployed Cloud Functions is displayed. Select a function to view its logs in real time.",
    "section_auth": "Firebase Auth Management",
    "auth_desc": "Select \"Auth\" from the sidebar. A list of users registered in Firebase Authentication is displayed. You can create, delete, and view details of users.",
    "shot_functions": "Screenshot: Functions log stream and Auth user list"
  },
  "de": {
    "nav_home": "Startseite",
    "nav_getting_started": "Erste Schritte",
    "nav_firestore": "Firestore",
    "nav_storage": "Speicher",
    "nav_backup": "Sicherung",
    "nav_functions": "Functions & Auth",
    "nav_license": "Lizenz",
    "nav_settings": "Einstellungen",
    "manual_label": "Web-Handbuch",
    "sidebar_title": "Seiten",
    "hero_badge": "Desktop-Handbuch",
    "page_title": "Cloud Functions & Auth",
    "page_desc": "Verwalten Sie Cloud Functions-Protokolle und Firebase Auth-Benutzer an einem Ort.",
    "section_functions": "Cloud Functions-Protokolle",
    "functions_desc": "Wählen Sie „Functions“ aus der Seitenleiste. Eine Liste der bereitgestellten Cloud Functions wird angezeigt. Wählen Sie eine Funktion aus, um ihre Protokolle in Echtzeit anzuzeigen.",
    "section_auth": "Firebase Auth-Verwaltung",
    "auth_desc": "Wählen Sie „Auth“ aus der Seitenleiste. Eine Liste der in Firebase Authentication registrierten Benutzer wird angezeigt. Sie können Benutzer erstellen, löschen und Details anzeigen.",
    "shot_functions": "Screenshot: Functions-Protokollstream und Auth-Benutzerliste"
  }
};
    const LANGS = ['ja', 'en', 'de'];
    function applyTexts(lang) {
      const dict = TEXTS[lang] || TEXTS.ja;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-key]').forEach((element) => {
        const key = element.dataset.key;
        if (Object.prototype.hasOwnProperty.call(dict, key)) element.textContent = dict[key];
      });
      // Update figure image sources for current language
      document.querySelectorAll('figure[data-fig]').forEach((fig) => {
        const name = fig.dataset.fig;
        const img = fig.querySelector('img');
        if (img) {
          fig.classList.remove('has-error');
          img.classList.remove('loaded');
          img.src = `./img/${lang}/${name}`;
        }
      });
      const titleKey = document.body.dataset.titleKey;
      if (titleKey && dict[titleKey]) document.title = `${dict[titleKey]} | Firemaru`;
      LANGS.forEach((code) => {
        const button = document.getElementById(`btn-${code}`);
        if (button) button.classList.toggle('active', code === lang);
      });
    }
    function setLang(lang) { if (!TEXTS[lang]) return; localStorage.setItem('lang', lang); applyTexts(lang); }
    function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }
    function closeSidebar() { document.body.classList.remove('sidebar-open'); }
    document.addEventListener('DOMContentLoaded', () => {
      const stored = localStorage.getItem('lang');
      applyTexts(TEXTS[stored] ? stored : 'ja');
      document.querySelectorAll('.sidebar a, .brand').forEach((link) => link.addEventListener('click', () => { if (window.innerWidth <= 960) closeSidebar(); }));
      window.addEventListener('resize', () => { if (window.innerWidth > 960) closeSidebar(); });
    });
  </script>
</body>
</html>
