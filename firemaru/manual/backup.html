<body data-title-key="page_title">

  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <p class="sidebar-label" data-key="sidebar_title"></p>
        <nav>
          <a class="" href="./index.html"><span data-key="nav_home"></span></a>
          <a class="" href="./getting-started.html"><span data-key="nav_getting_started"></span></a>
          <a class="" href="./firestore.html"><span data-key="nav_firestore"></span></a>
          <a class="" href="./storage.html"><span data-key="nav_storage"></span></a>
          <a class="active" href="./backup.html"><span data-key="nav_backup"></span></a>
          <a class="" href="./functions.html"><span data-key="nav_functions"></span></a>
          <a class="" href="./auth.html"><span data-key="nav_auth"></span></a>
          <a class="" href="./license.html"><span data-key="nav_license"></span></a>
          <a class="" href="./settings.html"><span data-key="nav_settings"></span></a>
        </nav>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="closeSidebar()"></div>
    <main class="page-content">
      <section class="hero-card"><div class="eyebrow" data-key="hero_badge"></div><h1 data-key="page_title"></h1><p class="lead" data-key="page_desc"></p></section>
<div class="section-stack">
  <section class="content-section"><div class="section-header"><div><h2 data-key="section_backup"></h2></div></div><p data-key="backup_desc"></p><figure class="screenshot" data-fig="fig4-1.png"><img src="./img/ja/fig4-1.png" alt="" onload="this.classList.add('loaded')" onerror="this.closest('figure').classList.add('has-error')"><div class="fig-placeholder"><span class="fig-name">fig4-1.png</span><span class="fig-desc" data-key="shot_backup"></span></div><figcaption><span class="fig-name">fig4-1.png</span> — <span data-key="shot_backup"></span></figcaption></figure></section>
  <section class="content-section"><div class="section-header"><div><h2 data-key="section_restore"></h2></div></div><div class="mini-card-grid"><div class="mini-card"><p data-key="restore_mode_merge"></p></div><div class="mini-card"><p data-key="restore_mode_overwrite"></p></div></div><div class="warning-box" data-key="restore_note_no_delete"></div><div class="warning-box" data-key="restore_warning"></div></section>
  <section class="content-section"><div class="section-header"><div><h2 data-key="section_lock"></h2></div></div><p data-key="lock_desc"></p></section>
</div>
      
    </main>
  </div>
  <script>

    "shot_backup": "Screenshot: バックアップ進捗ダイアログ"
  },
  "en": {
    "nav_home": "Home",
    "nav_getting_started": "Getting Started",
    "nav_firestore": "Firestore",
    "nav_storage": "Storage",
    "nav_backup": "Backup",
    "nav_functions": "Functions",
    "nav_auth": "Auth",
    "nav_license": "License",
    "nav_settings": "Settings",
    "manual_label": "Web Manual",
    "sidebar_title": "Pages",
    "hero_badge": "Desktop Manual",
    "page_title": "Backup / Restore",

    "restore_warning": "Die Wiederherstellung kann nicht rückgängig gemacht werden. Es wird empfohlen, vorher eine Sicherung zu erstellen.",
    "section_lock": "Exklusivsperre",
    "lock_desc": "Pro Firebase-Projekt kann jeweils nur eine Operation (Sicherung, Wiederherstellung, Import oder Export) gleichzeitig ausgeführt werden. Wenn ein anderes Fenster eine Operation am selben Projekt ausführt, wird die neue Anfrage blockiert und eine Fehlermeldung angezeigt. Gleichzeitige Operationen auf verschiedenen Firebase-Projekten sind erlaubt.",
    "shot_backup": "Screenshot: Dialog für den Sicherungsfortschritt"
  }
};
    const LANGS = ['ja', 'en', 'de'];
    function applyTexts(lang) {
      const dict = TEXTS[lang] || TEXTS.ja;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-key]').forEach((element) => {
        const key = element.dataset.key;
        if (Object.prototype.hasOwnProperty.call(dict, key)) element.textContent = dict[key];
      });
      // Update figure image sources for current language
      document.querySelectorAll('figure[data-fig]').forEach((fig) => {
        const name = fig.dataset.fig;
        const img = fig.querySelector('img');
        if (img) {
          fig.classList.remove('has-error');
          img.classList.remove('loaded');
          img.src = `./img/${lang}/${name}`;
        }
      });
      const titleKey = document.body.dataset.titleKey;
      if (titleKey && dict[titleKey]) document.title = `${dict[titleKey]} | Firemaru`;
      LANGS.forEach((code) => {
        const button = document.getElementById(`btn-${code}`);
        if (button) button.classList.toggle('active', code === lang);
      });
    }
    function setLang(lang) { if (!TEXTS[lang]) return; localStorage.setItem('lang', lang); applyTexts(lang); }
    function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }
    function closeSidebar() { document.body.classList.remove('sidebar-open'); }
    document.addEventListener('DOMContentLoaded', () => {
      const stored = localStorage.getItem('lang');
      applyTexts(TEXTS[stored] ? stored : 'ja');
      document.querySelectorAll('.sidebar a, .brand').forEach((link) => link.addEventListener('click', () => { if (window.innerWidth <= 960) closeSidebar(); }));
      window.addEventListener('resize', () => { if (window.innerWidth > 960) closeSidebar(); });
    });
  </script>
</body>
</html>
