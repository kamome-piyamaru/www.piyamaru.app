<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firemaru</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body data-title-key="page_title">
  <header class="site-header">
    <div class="header-left">
      <button type="button" class="menu-button" aria-label="Toggle navigation" onclick="toggleSidebar()">☰</button>
      <a class="brand" href="./index.html">
        <img class="brand-logo" src="./assets/logo.png" alt="Firemaru logo" />
        <div class="brand-copy">
          <strong>Firemaru</strong>
          <span data-key="manual_label"></span>
        </div>
      </a>
    </div>
    <div class="header-right">
      <div class="lang-switcher">
        <button type="button" onclick="setLang('ja')" id="btn-ja">JA</button>
        <button type="button" onclick="setLang('en')" id="btn-en">EN</button>
        <button type="button" onclick="setLang('de')" id="btn-de">DE</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <p class="sidebar-label" data-key="sidebar_title"></p>
        <nav>
          <a class="" href="./index.html"><span data-key="nav_home"></span></a>
          <a class="" href="./getting-started.html"><span data-key="nav_getting_started"></span></a>
          <a class="" href="./firestore.html"><span data-key="nav_firestore"></span></a>
          <a class="" href="./storage.html"><span data-key="nav_storage"></span></a>
          <a class="active" href="./backup.html"><span data-key="nav_backup"></span></a>
          <a class="" href="./functions.html"><span data-key="nav_functions"></span></a>
          <a class="" href="./license.html"><span data-key="nav_license"></span></a>
          <a class="" href="./settings.html"><span data-key="nav_settings"></span></a>
        </nav>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="closeSidebar()"></div>
    <main class="page-content">
      <section class="hero-card"><div class="eyebrow" data-key="hero_badge"></div><h1 data-key="page_title"></h1><p class="lead" data-key="page_desc"></p></section>
<div class="section-stack">
  <section class="content-section"><div class="section-header"><div><h2 data-key="section_backup"></h2></div></div><p data-key="backup_desc"></p><figure class="screenshot" data-fig="fig4-1.png"><img src="./img/ja/fig4-1.png" alt="" onload="this.classList.add('loaded')" onerror="this.closest('figure').classList.add('has-error')"><div class="fig-placeholder"><span class="fig-name">fig4-1.png</span><span class="fig-desc" data-key="shot_backup"></span></div><figcaption><span class="fig-name">fig4-1.png</span> — <span data-key="shot_backup"></span></figcaption></figure></section>
  <section class="content-section"><div class="section-header"><div><h2 data-key="section_restore"></h2></div></div><div class="mini-card-grid"><div class="mini-card"><p data-key="restore_mode_merge"></p></div><div class="mini-card"><p data-key="restore_mode_overwrite"></p></div></div><div class="warning-box" data-key="restore_warning"></div></section>
</div>
      
    </main>
  </div>
  <script>
    const TEXTS = {
  "ja": {
    "nav_home": "ホーム",
    "nav_getting_started": "はじめに",
    "nav_firestore": "Firestore",
    "nav_storage": "Storage",
    "nav_backup": "バックアップ",
    "nav_functions": "Functions & Auth",
    "nav_license": "ライセンス",
    "nav_settings": "設定",
    "manual_label": "Webマニュアル",
    "sidebar_title": "ページ一覧",
    "hero_badge": "Desktop Manual",
    "page_title": "バックアップ / リストア",
    "page_desc": "Firestore コレクションのバックアップと復元を行います。",
    "section_backup": "バックアップ",
    "backup_desc": "コレクションを選択して「バックアップ」ボタンをクリックします。サブコレクションを含む全ドキュメントがJSON形式でエクスポートされます。総件数に基づいた進捗バーが表示されます。バックアップ中に「キャンセル」ボタンで中断できます。",
    "section_restore": "リストア",
    "restore_mode_merge": "マージモード: 既存ドキュメントを保持したまま、バックアップデータを追加・上書き",
    "restore_mode_overwrite": "上書きモード: コレクションを一旦全削除してからバックアップデータを復元",
    "restore_warning": "上書きモードは元に戻せません。事前にバックアップを取ることをお勧めします。",
    "shot_backup": "Screenshot: バックアップ進捗ダイアログ"
  },
  "en": {
    "nav_home": "Home",
    "nav_getting_started": "Getting Started",
    "nav_firestore": "Firestore",
    "nav_storage": "Storage",
    "nav_backup": "Backup",
    "nav_functions": "Functions & Auth",
    "nav_license": "License",
    "nav_settings": "Settings",
    "manual_label": "Web Manual",
    "sidebar_title": "Pages",
    "hero_badge": "Desktop Manual",
    "page_title": "Backup / Restore",
    "page_desc": "Backup and restore Firestore collections.",
    "section_backup": "Backup",
    "backup_desc": "Select a collection and click \"Backup\". All documents including subcollections are exported in JSON format. A progress bar based on total document count is displayed. Click \"Cancel\" during backup to stop.",
    "section_restore": "Restore",
    "restore_mode_merge": "Merge mode: Keeps existing documents and adds/overwrites with backup data",
    "restore_mode_overwrite": "Overwrite mode: Delete the entire collection first, then restore from backup",
    "restore_warning": "Overwrite mode cannot be undone. It is recommended to take a backup beforehand.",
    "shot_backup": "Screenshot: Backup progress dialog"
  },
  "de": {
    "nav_home": "Startseite",
    "nav_getting_started": "Erste Schritte",
    "nav_firestore": "Firestore",
    "nav_storage": "Speicher",
    "nav_backup": "Sicherung",
    "nav_functions": "Functions & Auth",
    "nav_license": "Lizenz",
    "nav_settings": "Einstellungen",
    "manual_label": "Web-Handbuch",
    "sidebar_title": "Seiten",
    "hero_badge": "Desktop-Handbuch",
    "page_title": "Sicherung / Wiederherstellung",
    "page_desc": "Firestore-Sammlungen sichern und wiederherstellen.",
    "section_backup": "Sicherung",
    "backup_desc": "Wählen Sie eine Sammlung aus und klicken Sie auf „Sicherung“. Alle Dokumente einschließlich Teilsammlungen werden im JSON-Format exportiert. Ein Fortschrittsbalken basierend auf der Gesamtanzahl der Dokumente wird angezeigt. Klicken Sie während der Sicherung auf „Abbrechen“, um zu stoppen.",
    "section_restore": "Wiederherstellung",
    "restore_mode_merge": "Zusammenführungsmodus: Vorhandene Dokumente beibehalten und Sicherungsdaten hinzufügen/überschreiben",
    "restore_mode_overwrite": "Überschreibungsmodus: Gesamte Sammlung zuerst löschen, dann aus der Sicherung wiederherstellen",
    "restore_warning": "Der Überschreibungsmodus kann nicht rückgängig gemacht werden. Es wird empfohlen, vorher eine Sicherung zu erstellen.",
    "shot_backup": "Screenshot: Dialog für den Sicherungsfortschritt"
  }
};
    const LANGS = ['ja', 'en', 'de'];
    function applyTexts(lang) {
      const dict = TEXTS[lang] || TEXTS.ja;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-key]').forEach((element) => {
        const key = element.dataset.key;
        if (Object.prototype.hasOwnProperty.call(dict, key)) element.textContent = dict[key];
      });
      // Update figure image sources for current language
      document.querySelectorAll('figure[data-fig]').forEach((fig) => {
        const name = fig.dataset.fig;
        const img = fig.querySelector('img');
        if (img) {
          fig.classList.remove('has-error');
          img.classList.remove('loaded');
          img.src = `./img/${lang}/${name}`;
        }
      });
      const titleKey = document.body.dataset.titleKey;
      if (titleKey && dict[titleKey]) document.title = `${dict[titleKey]} | Firemaru`;
      LANGS.forEach((code) => {
        const button = document.getElementById(`btn-${code}`);
        if (button) button.classList.toggle('active', code === lang);
      });
    }
    function setLang(lang) { if (!TEXTS[lang]) return; localStorage.setItem('lang', lang); applyTexts(lang); }
    function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }
    function closeSidebar() { document.body.classList.remove('sidebar-open'); }
    document.addEventListener('DOMContentLoaded', () => {
      const stored = localStorage.getItem('lang');
      applyTexts(TEXTS[stored] ? stored : 'ja');
      document.querySelectorAll('.sidebar a, .brand').forEach((link) => link.addEventListener('click', () => { if (window.innerWidth <= 960) closeSidebar(); }));
      window.addEventListener('resize', () => { if (window.innerWidth > 960) closeSidebar(); });
    });
  </script>
</body>
</html>
