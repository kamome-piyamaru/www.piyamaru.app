    </aside>
    <div class="sidebar-overlay" onclick="closeSidebar()"></div>
    <main class="page-content">
      <section class="hero-card"><div class="eyebrow" data-key="hero_badge"></div><h1 data-key="page_title"></h1><p class="lead" data-key="page_desc"></p></section>
<div class="section-stack">
  <section class="content-section"><div class="mini-card-grid"><div class="mini-card"><h2 data-key="section_trial"></h2><p data-key="trial_desc"></p></div><div class="mini-card"><h2 data-key="section_plans"></h2><ul class="info-list"><li data-key="plan_monthly"></li><li data-key="plan_annual"></li></ul></div></div></section>
  <section class="content-section"><div class="mini-card-grid"><div class="mini-card"><h2 data-key="section_subscribe"></h2><p data-key="subscribe_desc"></p></div><div class="mini-card"><h2 data-key="section_devices"></h2><p data-key="devices_desc"></p></div></div></section>
  <section class="content-section"><div class="section-header"><div><h2 data-key="section_account"></h2></div></div><p data-key="account_desc"></p><figure class="screenshot" data-fig="fig6-1.png"><img src="./img/ja/fig6-1.png" alt="" onload="this.classList.add('loaded')" onerror="this.closest('figure').classList.add('has-error')"><div class="fig-placeholder"><span class="fig-name">fig6-1.png</span><span class="fig-desc" data-key="shot_account"></span></div><figcaption><span class="fig-name">fig6-1.png</span> — <span data-key="shot_account"></span></figcaption></figure></section>
</div>
      
    </main>
  </div>
  <script>

    "section_account": "アカウント画面",

    "shot_account": "Screenshot: アカウント画面とライセンス状況"
  },
  "en": {
    "nav_home": "Home",
    "nav_getting_started": "Getting Started",
    "nav_firestore": "Firestore",
    "nav_storage": "Storage",
    "nav_backup": "Backup",
    "nav_functions": "Functions",
    "nav_auth": "Auth",

    "section_trial": "Free Trial",

    "subscribe_desc": "As the trial period approaches, a purchase screen appears in the app. Click \"Buy Plan\" to go to the Lemon Squeezy payment page.",

    "devices_desc": "Eine Lizenz kann auf bis zu 2 Geräten verwendet werden. Sie können die Geräteregistrierungen im Konto-Bildschirm überprüfen und entfernen.",
    "section_account": "Konto-Bildschirm",
    "account_desc": "Öffnen Sie den Konto-Bildschirm über das Konto-Symbol in der Kopfzeile. Überprüfen Sie Ihren Status, die verbleibenden Tage, den Kaufverlauf und den Link zum Kundenportal.",
    "shot_account": "Screenshot: Konto-Bildschirm und Lizenzstatus"
  }
};
    const LANGS = ['ja', 'en', 'de'];
    function applyTexts(lang) {
      const dict = TEXTS[lang] || TEXTS.ja;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-key]').forEach((element) => {
        const key = element.dataset.key;
        if (Object.prototype.hasOwnProperty.call(dict, key)) element.textContent = dict[key];
      });
      // Update figure image sources for current language
      document.querySelectorAll('figure[data-fig]').forEach((fig) => {
        const name = fig.dataset.fig;
        const img = fig.querySelector('img');
        if (img) {
          fig.classList.remove('has-error');
          img.classList.remove('loaded');
          img.src = `./img/${lang}/${name}`;
        }
      });
      const titleKey = document.body.dataset.titleKey;
      if (titleKey && dict[titleKey]) document.title = `${dict[titleKey]} | Firemaru`;
      LANGS.forEach((code) => {
        const button = document.getElementById(`btn-${code}`);
        if (button) button.classList.toggle('active', code === lang);
      });
    }
    function setLang(lang) { if (!TEXTS[lang]) return; localStorage.setItem('lang', lang); applyTexts(lang); }
    function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }
    function closeSidebar() { document.body.classList.remove('sidebar-open'); }
    document.addEventListener('DOMContentLoaded', () => {
      const stored = localStorage.getItem('lang');
      applyTexts(TEXTS[stored] ? stored : 'ja');
      document.querySelectorAll('.sidebar a, .brand').forEach((link) => link.addEventListener('click', () => { if (window.innerWidth <= 960) closeSidebar(); }));
      window.addEventListener('resize', () => { if (window.innerWidth > 960) closeSidebar(); });
    });
  </script>
</body>
</html>
