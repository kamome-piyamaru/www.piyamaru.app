<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firemaru</title>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body data-title-key="page_title">
  <header class="site-header">
    <div class="header-left">
      <button type="button" class="menu-button" aria-label="Toggle navigation" onclick="toggleSidebar()">☰</button>
      <a class="brand" href="./index.html">
        <img class="brand-logo" src="./assets/logo.png" alt="Firemaru logo" />
        <div class="brand-copy">
          <strong>Firemaru</strong>
          <span data-key="manual_label"></span>
        </div>
      </a>
    </div>
    <div class="header-right">
      <div class="lang-switcher">
        <button type="button" onclick="setLang('ja')" id="btn-ja">JA</button>
        <button type="button" onclick="setLang('en')" id="btn-en">EN</button>
        <button type="button" onclick="setLang('de')" id="btn-de">DE</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <p class="sidebar-label" data-key="sidebar_title"></p>
        <nav>
          <a class="" href="./index.html"><span data-key="nav_home"></span></a>
          <a class="" href="./getting-started.html"><span data-key="nav_getting_started"></span></a>
          <a class="" href="./firestore.html"><span data-key="nav_firestore"></span></a>
          <a class="" href="./storage.html"><span data-key="nav_storage"></span></a>
          <a class="" href="./backup.html"><span data-key="nav_backup"></span></a>
          <a class="" href="./functions.html"><span data-key="nav_functions"></span></a>
          <a class="" href="./license.html"><span data-key="nav_license"></span></a>
          <a class="active" href="./settings.html"><span data-key="nav_settings"></span></a>
        </nav>
      </div>
    </aside>
    <div class="sidebar-overlay" onclick="closeSidebar()"></div>
    <main class="page-content">
      <section class="hero-card"><div class="eyebrow" data-key="hero_badge"></div><h1 data-key="page_title"></h1><p class="lead" data-key="page_desc"></p></section>
<div class="section-stack">
  <section class="content-section"><div class="mini-card-grid"><div class="mini-card"><h2 data-key="section_theme"></h2><p data-key="theme_desc"></p></div><div class="mini-card"><h2 data-key="section_language"></h2><p data-key="language_desc"></p></div></div><figure class="screenshot" data-fig="fig7-1.png"><img src="./img/ja/fig7-1.png" alt="" onload="this.classList.add('loaded')" onerror="this.closest('figure').classList.add('has-error')"><div class="fig-placeholder"><span class="fig-name">fig7-1.png</span><span class="fig-desc" data-key="shot_settings"></span></div><figcaption><span class="fig-name">fig7-1.png</span> — <span data-key="shot_settings"></span></figcaption></figure></section>
  <section class="content-section"><div class="section-header"><div><h2 data-key="section_projects"></h2></div></div><p data-key="projects_desc"></p></section>
  <section class="content-section"><div class="section-header"><div><h2 data-key="section_data_location"></h2></div></div><p data-key="data_location_desc"></p><pre class="code-block"><span data-key="data_location_mac"></span>
<span data-key="data_location_win"></span></pre></section>
</div>
      
    </main>
  </div>
  <script>
    const TEXTS = {
  "ja": {
    "nav_home": "ホーム",
    "nav_getting_started": "はじめに",
    "nav_firestore": "Firestore",
    "nav_storage": "Storage",
    "nav_backup": "バックアップ",
    "nav_functions": "Functions & Auth",
    "nav_license": "ライセンス",
    "nav_settings": "設定",
    "manual_label": "Webマニュアル",
    "sidebar_title": "ページ一覧",
    "hero_badge": "Desktop Manual",
    "page_title": "設定",
    "page_desc": "アプリの各種設定を管理します。",
    "section_theme": "テーマ",
    "theme_desc": "ヘッダーのアイコンから Light・Dark Navy・OLED Black・Dim の 4 テーマを選択できます。",
    "section_language": "言語",
    "language_desc": "ヘッダーの言語切り替えから日本語・英語・ドイツ語を選択できます。設定はリロード後も保持されます。",
    "section_projects": "プロジェクト管理",
    "projects_desc": "Firebase プロジェクトの追加・編集・削除を行います。プロジェクト設定は暗号化されて Firestore に保存され、端末間で同期されます。",
    "section_data_location": "データ保存場所",
    "data_location_desc": "アプリのローカルデータは以下に保存されます。",
    "data_location_mac": "macOS: ~/Library/Application Support/firemaru/",
    "data_location_win": "Windows: %APPDATA%\\firemaru\\",
    "shot_settings": "Screenshot: 設定画面とテーマ選択"
  },
  "en": {
    "nav_home": "Home",
    "nav_getting_started": "Getting Started",
    "nav_firestore": "Firestore",
    "nav_storage": "Storage",
    "nav_backup": "Backup",
    "nav_functions": "Functions & Auth",
    "nav_license": "License",
    "nav_settings": "Settings",
    "manual_label": "Web Manual",
    "sidebar_title": "Pages",
    "hero_badge": "Desktop Manual",
    "page_title": "Settings",
    "page_desc": "Manage various app settings.",
    "section_theme": "Theme",
    "theme_desc": "Select from 4 themes via the header icon: Light, Dark Navy, OLED Black, and Dim.",
    "section_language": "Language",
    "language_desc": "Select Japanese, English, or German from the language switcher in the header. The setting is preserved after reload.",
    "section_projects": "Project Management",
    "projects_desc": "Add, edit, and delete Firebase projects. Project settings are encrypted and saved to Firestore, and synced across devices.",
    "section_data_location": "Data Storage Location",
    "data_location_desc": "The app's local data is stored in the following location.",
    "data_location_mac": "macOS: ~/Library/Application Support/firemaru/",
    "data_location_win": "Windows: %APPDATA%\\firemaru\\",
    "shot_settings": "Screenshot: Settings screen and theme picker"
  },
  "de": {
    "nav_home": "Startseite",
    "nav_getting_started": "Erste Schritte",
    "nav_firestore": "Firestore",
    "nav_storage": "Speicher",
    "nav_backup": "Sicherung",
    "nav_functions": "Functions & Auth",
    "nav_license": "Lizenz",
    "nav_settings": "Einstellungen",
    "manual_label": "Web-Handbuch",
    "sidebar_title": "Seiten",
    "hero_badge": "Desktop-Handbuch",
    "page_title": "Einstellungen",
    "page_desc": "Verschiedene App-Einstellungen verwalten.",
    "section_theme": "Design",
    "theme_desc": "Wählen Sie über das Kopfzeilen-Symbol aus 4 Designs: Light, Dark Navy, OLED Black und Dim.",
    "section_language": "Sprache",
    "language_desc": "Wählen Sie Japanisch, Englisch oder Deutsch aus dem Sprachumschalter in der Kopfzeile. Die Einstellung wird nach dem Neuladen beibehalten.",
    "section_projects": "Projektverwaltung",
    "projects_desc": "Firebase-Projekte hinzufügen, bearbeiten und löschen. Projekteinstellungen werden verschlüsselt in Firestore gespeichert und geräteübergreifend synchronisiert.",
    "section_data_location": "Datenspeicherort",
    "data_location_desc": "Die lokalen Daten der App werden an folgendem Ort gespeichert.",
    "data_location_mac": "macOS: ~/Library/Application Support/firemaru/",
    "data_location_win": "Windows: %APPDATA%\\firemaru\\",
    "shot_settings": "Screenshot: Einstellungsbildschirm und Designauswahl"
  }
};
    const LANGS = ['ja', 'en', 'de'];
    function applyTexts(lang) {
      const dict = TEXTS[lang] || TEXTS.ja;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-key]').forEach((element) => {
        const key = element.dataset.key;
        if (Object.prototype.hasOwnProperty.call(dict, key)) element.textContent = dict[key];
      });
      // Update figure image sources for current language
      document.querySelectorAll('figure[data-fig]').forEach((fig) => {
        const name = fig.dataset.fig;
        const img = fig.querySelector('img');
        if (img) {
          fig.classList.remove('has-error');
          img.classList.remove('loaded');
          img.src = `./img/${lang}/${name}`;
        }
      });
      const titleKey = document.body.dataset.titleKey;
      if (titleKey && dict[titleKey]) document.title = `${dict[titleKey]} | Firemaru`;
      LANGS.forEach((code) => {
        const button = document.getElementById(`btn-${code}`);
        if (button) button.classList.toggle('active', code === lang);
      });
    }
    function setLang(lang) { if (!TEXTS[lang]) return; localStorage.setItem('lang', lang); applyTexts(lang); }
    function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }
    function closeSidebar() { document.body.classList.remove('sidebar-open'); }
    document.addEventListener('DOMContentLoaded', () => {
      const stored = localStorage.getItem('lang');
      applyTexts(TEXTS[stored] ? stored : 'ja');
      document.querySelectorAll('.sidebar a, .brand').forEach((link) => link.addEventListener('click', () => { if (window.innerWidth <= 960) closeSidebar(); }));
      window.addEventListener('resize', () => { if (window.innerWidth > 960) closeSidebar(); });
    });
  </script>
</body>
</html>
